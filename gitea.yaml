# Child Application: Validated Patterns Gitea chart.
# Mirrors the Application the patterns-operator builds in newArgoGiteaApplication()
# (validatedpatterns/patterns-operator, internal/controller/argo.go).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-in-cluster
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.validatedpatterns.io/   # Helm repo, NOT .../charts/gitea
    chart: gitea
    targetRevision: 0.0.*                           # operator default; pin (e.g. 0.0.4) for reproducibility
    helm:
      # The chart's Route hardcodes service "gitea-in-cluster-http", so the
      # release name MUST be gitea-in-cluster (fullname = release name when it contains "gitea").
      releaseName: gitea-in-cluster
      # Typed values (not parameters): fsGroup must be an integer.
      # The rootless image and configure-gitea run as UID 1000.
      # nonroot allows that UID and fsGroup 1000. restricted-v2 does not,
      # and without fsGroup the new RBD volume stays root-owned
      # (init-directories: mkdir /data/git: Permission denied).
      # extraDeploy is wave -1, after the chart Namespace (wave -100) and
      # before the Deployment. Root only syncs this file, so the binding
      # and the admin secret have to live here or the pod never starts.
      values: |
        podSecurityContext:
          fsGroup: 1000
        extraDeploy:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: gitea-admin-secret
              namespace: vp-gitea
              annotations:
                argocd.argoproj.io/sync-wave: "-1"
            type: Opaque
            stringData:
              username: gitea_admin
              password: "Admin123!"
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: gitea-default-nonroot
              namespace: vp-gitea
              annotations:
                argocd.argoproj.io/sync-wave: "-1"
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: system:openshift:scc:nonroot
            subjects:
              - kind: ServiceAccount
                name: default
                namespace: vp-gitea
      parameters:
        - name: gitea.admin.existingSecret
          value: gitea-admin-secret
        # Default Route host: <route>-<namespace>.<apps domain>
        - name: gitea.console.href
          value: https://gitea-route-vp-gitea.apps.cluster-6fllz.dyn.redhatworkshops.io   # <-- CHANGE
        - name: gitea.config.server.ROOT_URL
          value: https://gitea-route-vp-gitea.apps.cluster-6fllz.dyn.redhatworkshops.io   # <-- CHANGE
  destination:
    server: https://kubernetes.default.svc
    namespace: vp-gitea            # chart hardcodes vp-gitea for Namespace/Role/RoleBinding/ConsoleLink
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 20
