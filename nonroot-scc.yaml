# Same RoleBinding the Helm release installs from gitea.yaml extraDeploy.
# root does not sync this file. Kept so the binding can be applied by hand
# if the Application is not used. The configure-gitea init container sets
# runAsUser: 1000, which the namespace restricted-v2 SCC rejects.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-default-nonroot
  namespace: vp-gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot
subjects:
  - kind: ServiceAccount
    name: default
    namespace: vp-gitea
